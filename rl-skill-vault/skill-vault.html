<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RL Skill Vault</title>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-card: #1c2128;
            --border: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --accent: #58a6ff;
            --success: #3fb950;
            --warning: #d29922;
            --tag-bg: #388bfd26;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 20px 32px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 24px; font-weight: 600; }
        .header h1 span { color: var(--accent); }
        .stats { display: flex; gap: 32px; }
        .stat { text-align: center; }
        .stat-value { font-size: 28px; font-weight: 700; color: var(--accent); }
        .stat-label { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }

        .toolbar {
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 32px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .search-box { flex: 1; min-width: 200px; max-width: 400px; }
        .search-box input {
            width: 100%;
            padding: 10px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
        }
        .search-box input:focus { outline: none; border-color: var(--accent); }
        .search-box input::placeholder { color: var(--text-muted); }
        .filter-btn {
            padding: 10px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        .last-updated {
            margin-left: auto;
            font-size: 12px;
            color: var(--text-muted);
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 0 32px 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.2s;
        }
        .card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .card-name { font-size: 18px; font-weight: 600; color: var(--text-primary); }
        .card-version {
            font-size: 12px;
            padding: 4px 8px;
            background: var(--tag-bg);
            color: var(--accent);
            border-radius: 12px;
            font-weight: 500;
        }
        .card-date { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }
        .card-description {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-refs { border-top: 1px solid var(--border); padding-top: 12px; }
        .card-refs-title { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .ref-tag {
            display: inline-block;
            font-size: 11px;
            padding: 3px 8px;
            margin: 2px;
            background: var(--bg-secondary);
            border-radius: 4px;
            color: var(--text-secondary);
        }
        .ref-tag.referenced-by { background: #3fb95022; color: var(--success); }
        .ref-tag.references { background: #d2992222; color: var(--warning); }

        .hint {
            text-align: center;
            padding: 12px;
            background: var(--bg-secondary);
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            color: var(--text-muted);
        }
    </style>
</head>

        <span class="last-updated" id="last-updated"></span>
    </div>

        let filteredSkills = [...SKILLS_DATA];

        function render(filter = 'all', search = '') {
            const grid = document.getElementById('grid');

            filteredSkills = SKILLS_DATA.filter(s => {
                if (filter !== 'all' && s.type !== filter) return false;
                if (search) {
                    const q = search.toLowerCase();
                    return s.name.toLowerCase().includes(q) || s.description.toLowerCase().includes(q);
                }
                return true;
            });

            document.getElementById('total-skills').textContent = SKILLS_DATA.length;
            document.getElementById('total-refs').textContent = SKILLS_DATA.reduce((sum, s) => sum + (s.references?.length || 0), 0);
            document.getElementById('last-updated').textContent = 'Updated: 2026-04-24 08:30';

            if (filteredSkills.length === 0) {
                grid.innerHTML = '<div style="text-align:center;padding:60px;color:var(--text-secondary)">No skills found</div>';
                return;
            }

            grid.innerHTML = filteredSkills.map(skill => {
                const refByHtml = (skill.referencedBy?.length)
                    ? `<div class="card-refs-title">Referenced By</div>${skill.referencedBy.map(n => `<span class="ref-tag referenced-by">${n}</span>`).join('')}`
                    : '';
                const refsToHtml = (skill.references?.length)
                    ? `<div class="card-refs-title" style="margin-top:8px">References</div>${skill.references.map(n => `<span class="ref-tag references">${n}</span>`).join('')}`
                    : '';

                return `
                <div class="card">
                    <div class="card-header">
                        <div class="card-name">${skill.name}</div>
                        <div class="card-version">v${skill.version}</div>
                    </div>
                    <div class="card-date">Created: ${skill.created}</div>
                    <div class="card-description">${skill.description}</div>
                    ${refByHtml || refsToHtml ? `<div class="card-refs">${refByHtml}${refsToHtml}</div>` : ''}
                </div>`;
            }).join('');
        }

        document.getElementById('search').addEventListener('input', e => {
            const act = document.querySelector('.filter-btn.active').dataset.filter;
            render(act, e.target.value);
        });
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                render(btn.dataset.filter, document.getElementById('search').value);
            });
        });

        render();
    </script>
